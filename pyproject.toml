[project]
name = "weather-data-scraper"
version = "1.0.0"
description = "Open-Meteo weather scraping, pandas processing, CSV export, charts and a FastAPI dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tinydb>=4.9.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = [".venv", "output"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["output"]  # generated deliverables

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
