[project]
name = "weather-data-scraper"
version = "1.0.0"
description = "Open-Meteo weather scraping, pandas processing, CSV export, charts and a FastAPI dashboard"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = [".venv", "output"]
typeCheckingMode = "standard"
